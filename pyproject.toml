[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cs566-penn-action"
version = "0.1.0"
description = "Shared Penn Action preprocessing and skeleton-action baselines for CS566"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
penn-preprocess = "cs566_action.preprocess:main"
penn-train-mlp = "cs566_action.train_mlp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

